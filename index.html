<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Juna &amp; Matti</title>
<meta name="theme-color" content="#0b0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juna & Matti">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="home">
  <div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- Startbildschirm -->
  <main id="home" class="screen">
    <div class="home-top">
      <div class="clock" id="clock">09:41</div>
      <div class="date" id="date"></div>
      <div class="app-version">Version 1.0</div>
    </div>
    <button class="widget glass" data-action="open" id="widget"></button>
    <section id="home-req" aria-label="Offene Anfragen"></section>
    <section id="home-notes" aria-label="Notizen"></section>
  </main>

  <!-- Finanz Manager -->
  <main id="manager" class="screen appscreen" aria-hidden="true">
    <header class="bar">
      <button class="round glass" data-action="close" aria-label="Zurück">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <h1>Finanzen</h1>
      <button class="round glass" data-action="settings" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <div class="scroll">
      <section id="hero"></section>
      <div class="section-title"><span>Spalten</span></div>
      <section id="items" class="items"></section>
      <div class="section-title"><span>Statistik</span></div>
      <section id="stats" class="stats glass"></section>
      <div class="section-title"><span>Verlauf</span></div>
      <section id="history" class="history glass"></section>
    </div>
  </main>

  <!-- MacPoints -->
  <main id="mac" class="screen appscreen" aria-hidden="true">
    <header class="bar">
      <button class="round glass" data-action="close" aria-label="Zurück">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <h1 id="mac-title">MacPoints</h1>
      <span class="round"></span>
    </header>
    <div class="scroll" id="mac-body"></div>
  </main>

  <!-- Notes -->
  <main id="notes" class="screen appscreen" aria-hidden="true">
    <header class="bar list-bar">
      <button class="round glass" data-action="close" aria-label="Zurück">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <h1>Notes</h1>
      <button class="round glass" data-action="note-new" aria-label="Neue Notiz">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <header class="bar edit-bar">
      <button class="round glass" data-action="note-back" aria-label="Alle Notizen">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h1 id="note-date"></h1>
      <button class="round glass danger" id="note-del" data-action="note-del" aria-label="Notiz löschen"></button>
    </header>
    <section id="note-share" class="note-share" aria-label="Teilen"></section>
    <div class="scroll" id="note-list"></div>
    <section id="note-tasks" class="note-tasks"></section>
    <textarea id="note-text" class="note-text" placeholder="Notiz schreiben …" aria-label="Notiz"></textarea>
  </main>

  <!-- Inventar -->
  <main id="inv" class="screen appscreen" aria-hidden="true">
    <header class="bar">
      <button class="round glass" data-action="close" aria-label="Zurück">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <h1>Inventar</h1>
      <span class="round"></span>
    </header>
    <div class="scroll" id="inv-body"></div>
  </main>

  <!-- Admin (nur für den Admin sichtbar) -->
  <main id="adm" class="screen appscreen" aria-hidden="true">
    <header class="bar">
      <button class="round glass" data-action="close" aria-label="Zurück">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <h1>Admin</h1>
      <span class="round"></span>
    </header>
    <div class="scroll" id="adm-body"></div>
  </main>

  <!-- Dock -->
  <nav class="dock glass" aria-label="Apps">
    <button class="app" data-action="toggle" data-app="manager" aria-label="Finanz Manager">
      <span class="app-icon"><svg viewBox="0 0 24 24"><path d="M17.5 6.2A6.6 6.6 0 0 0 7.2 9.5M17.5 17.8A6.6 6.6 0 0 1 7.2 14.5M4.5 10h8.5M4.5 14h7"/></svg></span>
      <span class="dot"></span>
    </button>
    <button class="app" data-action="toggle" data-app="mac" aria-label="MacPoints">
      <span class="app-icon mac"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg></span>
      <span class="nbadge" id="req-badge"></span>
      <span class="dot"></span>
    </button>
    <button class="app" data-action="toggle" data-app="notes" aria-label="Notes">
      <span class="app-icon notes"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span>
      <span class="dot"></span>
    </button>
    <button class="app" data-action="toggle" data-app="inv" aria-label="Inventar">
      <span class="app-icon inv"><svg viewBox="0 0 24 24"><path d="M8.5 7V6a3.5 3.5 0 0 1 7 0v1"/><rect x="5" y="7" width="14" height="14" rx="3.5"/><path d="M9 13h6v3.5H9z"/></svg></span>
      <span class="dot"></span>
    </button>
    <button class="app" data-action="toggle" data-app="adm" aria-label="Admin" hidden>
      <span class="app-icon adm"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <span class="nbadge" id="adm-badge"></span>
      <span class="dot"></span>
    </button>
  </nav>

  <!-- Login -->
  <div id="login" class="lockscreen" aria-hidden="true"></div>

  <!-- Einstellungen -->
  <div class="backdrop" data-action="settings-close"></div>
  <aside class="sheet" id="sheet" aria-hidden="true">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2>Einstellungen</h2>
      <button class="done" data-action="settings-close">Fertig</button>
    </div>
    <div class="sheet-body" id="settings"></div>
  </aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
<script src="emojis.js"></script>
<script src="app.js"></script>
</body>
</html>
