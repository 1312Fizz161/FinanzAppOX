# Nginx-Konfiguration für „Juna & Matti“ (statische Seite).
# Vor dem Einsatz: example.de durch deine Domain ersetzen.
# Mit Certbot kommt danach HTTPS dazu (siehe README).

server {
    listen 80;
    listen [::]:80;
    server_name example.de www.example.de;

    root /var/www/finanzapp;
    index index.html;

    server_tokens off;

    # Sicherheits-Header (gelten für alle Dateien dieser Seite)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Icons dürfen länger im Cache bleiben
    location ~* \.(png|svg)$ {
        expires 7d;
        try_files $uri =404;
    }

    # App-Dateien immer prüfen lassen, damit Updates sofort ankommen
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Versteckte Dateien (z. B. .git) nie ausliefern
    location ~ /\. {
        deny all;
    }
}
